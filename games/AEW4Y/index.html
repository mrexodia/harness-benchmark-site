<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tideline — an island fishing spot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="320" height="180"></canvas>

    <!-- Full-resolution UI overlay, aligned to the 1280x720 stage -->
    <div id="ui">
      <div id="titlebox">
        <div id="title">TIDELINE</div>
        <div id="hint">Press <b>SPACE</b> or the button to cast</div>
      </div>

      <div id="logbox">
        <div class="panel-title">CATCH LOG</div>
        <ol id="loglist"></ol>
        <div id="logempty">No catches yet…</div>
      </div>

      <div id="legendbox">
        <div class="panel-title">RARITY ODDS</div>
        <div id="legendrows"></div>
      </div>

      <div id="bitecue">BITE! &#8212; REEL NOW</div>

      <button id="action" type="button">CAST</button>

      <div id="toast"></div>

      <div id="revealcard">
        <div id="revealrarity"></div>
        <div id="revealname"></div>
        <div id="revealsub"></div>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool Landing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="180"></canvas>

  <!-- HUD overlay, drawn at full resolution -->
  <div id="hud">
    <div id="legend" class="panel">
      <div class="panel-title">Catch Odds</div>
      <ul id="legendList"></ul>
    </div>

    <div id="prompt" class="pill">Press <b>SPACE</b> to cast</div>

    <div id="logPanel" class="panel">
      <div class="panel-title">Catch Log</div>
      <ol id="logList"><li class="empty">Nothing yet&hellip;</li></ol>
    </div>

    <button id="actionBtn" type="button">Cast</button>
  </div>

  <!-- Reveal card -->
  <div id="reveal" aria-hidden="true">
    <div id="revealCard">
      <div id="revealGlow"></div>
      <canvas id="revealFish"></canvas>
      <div id="revealRarity">Rare</div>
      <div id="revealName">Fish Name</div>
      <div id="revealHint">press SPACE to continue</div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>

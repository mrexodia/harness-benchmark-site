<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Driftwood Bay — a tiny fishing game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="320" height="180" aria-label="Fishing scene"></canvas>

    <div id="ui">
      <div id="topbar">
        <div id="title">DRIFTWOOD&nbsp;BAY</div>
        <div id="hint">a quiet fishing spot</div>
      </div>

      <div id="statusbar">
        <span id="status">Press SPACE or CAST</span>
      </div>

      <div id="intro">
        <b>SPACE</b> / <b>CAST</b> to cast &nbsp;·&nbsp; wait for the splash &nbsp;·&nbsp; press again to reel
      </div>

      <div id="logpanel" class="panel">
        <div class="panel-title">CATCH LOG <span class="dim">(last 8)</span></div>
        <ol id="loglist"></ol>
        <div id="logempty">nothing yet…</div>
      </div>

      <div id="legend" class="panel">
        <div class="panel-title">RARITY ODDS</div>
        <ul id="legendlist"></ul>
      </div>

      <button id="castbtn" type="button">CAST</button>

      <div id="reveal" class="hidden">
        <div class="ribbon"><span id="rword">Common</span></div>
        <div class="fishbox">
          <canvas id="rfish" width="1" height="1"></canvas>
        </div>
        <div class="info">
          <div id="rname">—</div>
          <div id="rlabel">caught!</div>
        </div>
      </div>
    </div>
  </div>

  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool Cove — a tiny fishing game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <div id="ui">
      <div id="title">TIDEPOOL COVE</div>

      <div id="hint">SPACE or CAST to cast your line.</div>

      <div id="logPanel" class="panel">
        <div class="panel-head">CATCH LOG <span class="panel-sub">last 8</span></div>
        <ul id="logList"></ul>
      </div>

      <div id="legendPanel" class="panel">
        <div class="panel-head">RARITY ODDS</div>
        <div id="legend"></div>
      </div>

      <button id="castBtn" class="cast-btn ready">CAST</button>

      <div id="revealCard" class="reveal-card">
        <div class="reveal-rays"></div>
        <div class="reveal-frame">
          <div class="reveal-top">
            <span id="revealRarity" class="reveal-rarity">Rare</span>
          </div>
          <canvas id="revealFish" width="64" height="36"></canvas>
          <div id="revealName" class="reveal-name">Fish Name</div>
          <div id="revealBlurb" class="reveal-blurb">A fine specimen!</div>
        </div>
        <div class="reveal-mark m1"></div>
        <div class="reveal-mark m2"></div>
        <div class="reveal-mark m3"></div>
        <div class="reveal-mark m4"></div>
      </div>
    </div>
  </div>

  <script src="js/fish.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Tidepool Cove — a cozy fishing spot</title>
<style>
  :root { --bg:#0b1016; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #16222c 0%, #080c10 100%);
  }
  #frame {
    position: absolute; left: 0; top: 0;
    width: 1280px; height: 720px;
    transform-origin: top left;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 2px #1d2a33, 0 24px 80px rgba(0,0,0,.7);
    background: #000;
  }
  #frame canvas { position: absolute; left: 0; top: 0; display: block; }
  #scene {
    width: 1280px; height: 720px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #ui { width: 1280px; height: 720px; }
  #ui.hand { cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="scene" width="320" height="180"></canvas>
      <canvas id="ui" width="1280" height="720"></canvas>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftwood Bay — Cozy Fishing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>

    <div id="ui">
      <!-- Rarity legend -->
      <div id="legend" aria-label="Rarity odds">
        <div class="legend-title">RARITY</div>
        <div class="legend-grid">
          <span class="chip" data-rarity="Common"><i></i>Common <b>45%</b></span>
          <span class="chip" data-rarity="Uncommon"><i></i>Uncommon <b>25%</b></span>
          <span class="chip" data-rarity="Rare"><i></i>Rare <b>15%</b></span>
          <span class="chip" data-rarity="Epic"><i></i>Epic <b>8%</b></span>
          <span class="chip" data-rarity="Legendary"><i></i>Legendary <b>5%</b></span>
          <span class="chip" data-rarity="Ancient"><i></i>Ancient <b>2%</b></span>
        </div>
      </div>

      <!-- Catch log -->
      <div id="log">
        <div class="log-title">CATCH LOG</div>
        <ul id="log-list"><li class="empty">No catches yet</li></ul>
      </div>

      <!-- Intro instruction -->
      <div id="intro">
        <div class="intro-title">Driftwood Bay</div>
        <div class="intro-sub">A quiet spot to cast a line</div>
        <div class="intro-line">Press <b>Space</b> or tap <b>Cast</b> to fish</div>
      </div>

      <!-- Reveal caption -->
      <div id="reveal" class="hidden">
        <div id="reveal-rarity" class="r-Common">Common</div>
        <div id="reveal-name">Fish Name</div>
        <div id="reveal-hint">press space to continue</div>
      </div>

      <!-- Controls -->
      <div id="controls">
        <div id="hint">Press <b>Space</b> or tap <b>Cast</b></div>
        <button id="action" type="button">CAST</button>
      </div>
    </div>
  </div>

  <script src="src/fish-data.js"></script>
  <script src="src/art.js"></script>
  <script src="src/game.js"></script>
</body>
</html>

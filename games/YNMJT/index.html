<!DOCTYPE html>
<html lang="en">
<head><script>addEventListener("keydown",function(e){var k=e.key;
if(k===" "||k==="Spacebar"||k==="ArrowUp"||k==="ArrowDown"||k==="PageUp"||k==="PageDown"){
var t=e.target;if(!(t&&t.closest&&t.closest("button,input,textarea,select,a,[contenteditable]")))e.preventDefault();}},false);
addEventListener("message",function(m){var d=m.data;if(!d||!d.hcKey)return;
var o={key:d.hcKey,code:d.code,keyCode:d.keyCode,which:d.keyCode,bubbles:true,cancelable:true};
var t=document.activeElement||document.body;t.dispatchEvent(new KeyboardEvent("keydown",o));t.dispatchEvent(new KeyboardEvent("keyup",o));});</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stillwater Cove</title>
<style>
  :root { --gold:#e8b24a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0e14;
    overflow: hidden;
    font-family: monospace;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    /* 1280x720 reference */
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 0 2px #1b2230, 0 18px 60px rgba(0,0,0,.7);
    background: #0b0e14;
  }
  canvas#game {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }
  /* invisible click target aligned over the drawn on-canvas button */
  #hit {
    position: absolute;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    /* geometry set from JS to match the drawn button */
    left: 0; top: 0; width: 0; height: 0;
    background: transparent;
    border: 0; padding: 0;
  }
  #hit:focus { outline: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="game" width="1280" height="720"></canvas>
      <button id="hit" aria-label="Cast / Reel"></button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
